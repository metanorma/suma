name: release-provenance

on:
  # Tag pushes reliably fan out (the release workflow pushes v* tags with a
  # PAT); release-published events created by CI tokens may not.
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Keyless sigstore signing exchanges this token for a short-lived certificate.
  id-token: write

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: sigstore/cosign-installer@v3
      - name: Build gem
        run: gem build suma.gemspec
      - name: Write, verify, and sign provenance
        run: bundle exec ruby bin/release_provenance
        env:
          SUMA_PROVENANCE_SIGN: sigstore
      - name: Independent sha256 pass
        run: sha256sum *.gem provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: |
            provenance.json
            provenance.json.bundle
